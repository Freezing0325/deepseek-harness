# dsh-tui profile patch layer.
#
# The TUI composes @deepseek-ai/dsh-base + the dsh-tui bundle, so its model
# picker lists whatever LLM routes that composition mounts. dsh-base mounts
# llm-pi-ai with NO routes (plus llm-deepseek = the official API), which is
# why the picker offered only official models.
#
# The two rows below are the same LLM configuration the Web profile carries in
# ~/.dsh/profiles/web020/cordis.patch.yml. llm-pi-ai reads its routes only from
# this plugin Config - there is no shared providers file - so the two copies
# must be edited together. Keep them in step when adding a provider or model.

# kept in step with ~/.dsh/profiles/web020/cordis.patch.yml
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: opencode-go-chat
    model: deepseek-flash
    reasoningEffort: high
- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      openai:
        baseURL: https://llmapi.paratera.com/v1
        api: openai-completions
        compat:
          thinkingFormat: deepseek
          supportsReasoningEffort: true
        models:
          - id: DeepSeek-V4-Flash
            name: DeepSeek-V4-Flash
            contextWindow: 1000000
            maxTokens: 65536
            reasoningEfforts:
              off: null
              low: low
              high: high
              max: max
        apiKeyEnv: OPENAI_API_KEY
      zai-coding-cn:
        models:
          - id: glm-4.5-air
            name: GLM-4.5-Air
            contextWindow: 131072
            maxTokens: 98304
          - id: glm-4.7
            name: GLM-4.7
            contextWindow: 204800
            maxTokens: 131072
          - id: glm-5-turbo
            name: GLM-5-Turbo
            contextWindow: 200000
            maxTokens: 131072
          - id: glm-5.1
            name: GLM-5.1
            contextWindow: 200000
            maxTokens: 131072
          - id: glm-5.2
            name: GLM-5.2
            contextWindow: 1000000
            maxTokens: 131072
          - id: glm-5v-turbo
            name: GLM-5V-Turbo
            contextWindow: 200000
            maxTokens: 131072
        apiKeyEnv: ZAI_CODING_CN_API_KEY
      opencode-go:
        apiKeyEnv: OPENCODE_GO_API_KEY
        models:
          - id: deepseek-v4-flash
            name: DeepSeek V4 Flash
            contextWindow: 1000000
            maxTokens: 384000
          - id: deepseek-v4-pro
            name: DeepSeek V4 Pro
            contextWindow: 1000000
            maxTokens: 384000
          - id: kimi-k3
            name: Kimi K3 (2x usage)
            contextWindow: 1048576
            maxTokens: 131072
      opencode-go-customized:
        displayName: OpenCode Go · Responses
        apiKeyEnv: OPENCODE_GO_CUSTOMIZED_API_KEY
        api: openai-responses
        baseURL: https://opencode.ai/zen/go/v1
        models:
          - id: gpt-5.6-luna
            name: GPT 5.6 Luna
            contextWindow: 272000
            maxTokens: 65536
          - id: grok-4.6
            name: Grok 4.6
            contextWindow: 200000
            maxTokens: 131072
          - id: muse-spark-1.2-contributor
            name: Muse Spark 1.2 Contributor
            contextWindow: 262144
            maxTokens: 32768
      opencode-go-chat:
        displayName: OpenCode Go · Chat
        apiKeyEnv: OPENCODE_GO_CUSTOMIZED_API_KEY
        api: openai-completions
        baseURL: https://opencode.ai/zen/go/v1
        reasoning: high
        models:
          - id: glm-5.3-flash
            name: GLM-5.3-Flash
            contextWindow: 200000
            maxTokens: 131072
          - id: glm-5.3
            name: GLM-5.3
            contextWindow: 1000000
            maxTokens: 131072
          - id: longcat-2.0
            name: LongCat-2.0
            contextWindow: 1000000
            maxTokens: 65536
          - id: deepseek-v4-flash-vision-exp
            name: DeepSeek V4 Flash Vision Exp
            contextWindow: 1000000
            maxTokens: 384000
            input:
              - text
              - image
          - id: hy4-preview
            name: Hy4 preview
            contextWindow: 262144
            maxTokens: 65536
          - id: deepseek-flash
            name: DeepSeek V4.1 Flash
            contextWindow: 1000000
            maxTokens: 384000
            input:
              - text
              - image
            reasoningEfforts:
              off: off
              low: low
              high: high
              max: max
      opencode-go-messages:
        displayName: OpenCode Go · Messages
        apiKeyEnv: OPENCODE_GO_CUSTOMIZED_API_KEY
        api: anthropic-messages
        baseURL: https://opencode.ai/zen/go
        models:
          - id: minimax-m2.5
            name: MiniMax M2.5
            contextWindow: 1000000
            maxTokens: 131072
          - id: qwen3.8-max
            name: Qwen3.8 Max
            contextWindow: 1000000
            maxTokens: 65536
          - id: qwen3.8-flash
            name: Qwen3.8 Flash
            contextWindow: 1000000
            maxTokens: 65536
      paratera:
        displayName: 并行智算云
        apiKeyEnv: PARATERA_API_KEY
        api: openai-completions
        baseURL: https://llmapi.paratera.com
        models:
          - id: DeepSeek-V4.1-Flash
            name: DeepSeek-V4.1-Flash
            contextWindow: 1000000
            maxTokens: 384000
