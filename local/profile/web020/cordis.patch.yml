# --- 2026-10-03：dsh-tui 的六个 web-plane 条目在 0.2.0-rc.2 下会毒死整个设置域 ---
# 症状：任何 settings/mutate 都被拒（settings/rejected:
#   "dsh-tui: root.events.emit is unavailable from a plugin activation"），
# 于是欢迎弹窗永远确认不了（"暂时无法保存确认状态"），设置面板里也写不进任何值。
# 根因是这些行在 settings 重载路径上于 plugin activation 期间 emit root events，
# 违反 cordis 的 invariant。web020 是 Web profile，用不到 TUI 的 Host seam，
# 故整组禁用（主条目 dsh-tui 见上方第 52 行，早已 disabled）。
# 上游修好或 dsh-tui 再发新版后，删掉这六条即可恢复。
- id: dsh-tui-workspaces
  disabled: true
- id: dsh-tui-command-trees
  disabled: true
- id: dsh-tui-settings-sections
  disabled: true
- id: dsh-tui-scenes
  disabled: true
- id: dsh-tui-plugin-host
  disabled: true
- id: dsh-tui-extensions
  disabled: true
