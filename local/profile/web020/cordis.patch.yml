# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).

# proxy-bridge: DSH 出站代理分流插件（opencode.ai 等海外网关走 Clash，国内服务直连）
# 由 2026-08-31 gpt-5.6-luna 地区限制排查安装；等效 TUN 但仅作用于 DSH 进程。
- insert:
    - id: proxy-bridge
      name: file:///C:/Users/YDELL/.dsh/plugins/proxy-bridge.cjs

# Fracture Mechanics Note plugin (installed by note-launcher.ps1)
#
# `disabled` is a !!js condition, so a moved or renamed note folder can no
# longer abort the whole boot ("plugin tree failed to load: Cannot find
# module") - the entry is skipped unless BOTH the switch file
# (~/.dsh/notes-enabled) and the plugin file itself exist. Toggle with:
#   deepseek note on | off | status
- insert:
    - id: fracture-note-plugin
      name: file:///D:/%E5%B0%B9%E6%80%9D%E6%98%B1/%E5%AD%A6%E4%B9%A0/%E5%AD%A6%E4%B9%A0/%E7%A0%94%E4%B8%80/%E7%A0%94%E4%B8%80%E4%B8%8B/%E6%96%AD%E8%A3%82%E5%8A%9B%E5%AD%A6/%E6%96%AD%E8%A3%82%E5%8A%9B%E5%AD%A6%E7%AC%94%E8%AE%B0%E6%8F%92%E4%BB%B6.cjs
      disabled: !!js "!(process.getBuiltinModule('node:fs').existsSync((process.env.U\
        SERPROFILE||'') + '/.dsh/notes-enabled') &&
        process.getBuiltinModule('node:fs').existsSync('D:/尹思昱/学习/学习/研一/研一下/断裂力\
        学/断裂力学笔记插件.cjs'))"
      config:
        workspaceDir: 'D:\尹思昱\学习\学习\研一\研一下\断裂力学'
        noteFile: 断裂力学笔记.html

# English Writing Note plugin (installed by note-launcher.ps1)
# Same !!js guard as the fracture note above: skipped when the switch file or
# the plugin file is missing, so a moved folder cannot break the boot.
- insert:
    - id: english-note-plugin
      name: file:///D:/%E5%B0%B9%E6%80%9D%E6%98%B1/%E5%AD%A6%E4%B9%A0/%E5%AD%A6%E4%B9%A0/%E7%A1%95%E5%8D%9A%E8%BF%9E%E8%AF%BB/%E8%8B%B1%E8%AF%AD%E5%86%99%E4%BD%9C%E5%86%B2%E5%88%BA%E6%8F%92%E4%BB%B6.cjs
      disabled: !!js "!(process.getBuiltinModule('node:fs').existsSync((process.env.U\
        SERPROFILE||'') + '/.dsh/notes-enabled') &&
        process.getBuiltinModule('node:fs').existsSync('D:/尹思昱/学习/学习/硕博连读/英语写作冲\
        刺插件.cjs'))"
      config:
        workspaceDir: 'D:\尹思昱\学习\学习\硕博连读'
        noteFile: 英语写作冲刺笔记.html
# dsh-tui 0.12.0 is the 0.2.0 line (its peers list `0.2.0-rc.1 || 0.2.0-rc.2`),
# so the bundle loads here instead of being skipped. Its six web-plane rows
# (workspaces / command-trees / settings-sections / scenes / plugin-host /
# extensions) are enabled by default and need no override, and its host-plane
# duplicates (storage*, workspace, code-runtime, webserver, cordis-host-runner)
# self-disable through `!!js` guards when the official rows exist. The
# interactive front door DOES need one: it binds a TTY, seeds the first
# workspace, and disposes the whole app tree when it unmounts, which belongs to
# the standalone `deepseek tui` profile, not to the web one. `working-activity`
# was an 0.1.5-era entry that no longer exists in 0.2.0, so it stays out.
- id: dsh-tui
  disabled: true
# dsh-better-sidebar 仍 import 已被新版 dsh-settings 移除的 settingsNamespace
# （npm 最新 0.17.1 亦未适配），无兼容版本可用，禁用直至上游适配。
- id: web-ui-better-sidebar
  disabled: true
# @linxin666/dsh-remote-web-ui@0.3.6 声明注入 apiProxy 服务，新版 dsh 已移除该
# 服务且此包无更高版本（0.3.6 即最新），禁用直至上游适配。
- id: web-ui-remote-web-ui
  disabled: true
# @linxin666/dsh-client-ui-aionui-panel@0.3.6（无更高版本）的 client 端直接 require
# 新版已删除的 @deepseek-ai/dsh-client-runtime/client，浏览器端模块加载会崩溃。
# 注意 entry id 是 web-ui-dsh-aionui-panel（见 dsh-web-ui-all 的 cordis.patch.yml）。
- id: web-ui-dsh-aionui-panel
  disabled: true

# --- dsh 0.2.0：尚未适配的四个插件（本 profile 专有，0.1.5 的 web profile 不受影响）---
# 下面四个包的 client 端 inject 了 `settingsScope` 服务，而 0.2.0 的客户端设置域
# 已把该服务换成 settingsSchema / configForms（src: packages/client/ui-settings）。
# 服务不存在 => fiber 永久 pending => 浏览器端 boot-client 的 assertEntriesActive
# 抛错，整页显示 "Failed to load plugins / web boot: N entries did not activate"，
# Web UI 完全打不开（一个 pending 条目就足以打死整个客户端）。
# 这四个包到 2026-10-01 为止的最新版仍 inject settingsScope：
#   dsh-perf 0.3.14 / dsh-doctor 0.3.24 / dsh-desktop-launcher 0.3.13 /
#   dsh-tool-describe-image 0.3.24（均已确认，无 0.4.x）。
# 作者为其余六个包发布了 0.2.0 线（0.4.x），见 pnpm-workspace.yaml 的 overrides。
# 等这四个也出 0.4.x：把 overrides 里的 0.3.12 提到新版，并删掉下面四条 disabled。
- id: web-ui-dsh-perf
  disabled: true
- id: web-ui-doctor
  disabled: true
- id: web-ui-desktop-launcher
  disabled: true
- id: web-ui-describe-image
  disabled: true

